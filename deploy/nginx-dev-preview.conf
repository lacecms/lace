# Docker substitutes only the two configured local DNS names.
map $http_upgrade $lace_dev_connection {
    default upgrade;
    '' close;
}

log_format lace_dev_safe '$remote_addr "$request_method $uri $server_protocol" $status';

server {
    listen 3443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 404;
}

server {
    listen 3443 ssl;
    server_name ${LACE_DEV_CMS_HOST} ${LACE_DEV_PREVIEW_HOST};
    ssl_certificate /etc/lace/tls/cert.pem;
    ssl_certificate_key /etc/lace/tls/key.pem;
    access_log /var/log/nginx/access.log lace_dev_safe;
    client_max_body_size 11m;

    location ^~ /api/v1/preview-runner/ { return 404; }

    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lace_dev_connection;
        proxy_set_header X-Forwarded-Proto https;
    }
}
