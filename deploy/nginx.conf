# Log paths only: OAuth authorization queries, callback codes, referrers and
# credential-bearing headers must not enter access logs.
log_format lace_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log lace_safe;

    # Matches the API's default JSON body limit (1 MiB).
    client_max_body_size 1m;

    # Media uploads: the API's media ceiling (10 MiB) plus 1 MiB for the
    # multipart envelope, streamed so the API's own size boundary decides.
    location = /api/v1/admin/media {
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /mcp {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mcp/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /.well-known/oauth-authorization-server/api/auth {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin {
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health/ {
        proxy_pass http://api:3000;
    }

    # Content-hashed build assets: a changed file gets a new name, so browsers
    # keep them for 30 days. Without `always`, a 404 is not cached.
    location /_astro/ {
        root /output/current;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Cloudflare Pages header rules travel in the build output; never serve them.
    location = /_headers {
        return 404;
    }

    # Browsers revalidate site responses so a switched release is seen on reload.
    location / {
        root /output/current;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ @no_release;
    }

    location @no_release {
        add_header Content-Type text/plain;
        add_header Cache-Control "no-cache" always;
        return 503 "Site build pending\n";
    }
}
