# Rendered by the Nginx image from the reserved preview hostnames.
server {
    listen 8080;
    server_name ${LACE_PREVIEW_HOSTNAMES};
    access_log /var/log/nginx/access.log lace_safe;

    location ~ ^/(?:access/(?:start|callback)$|view/|p/) {
        client_max_body_size 1m;
        proxy_pass http://api:3000;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / { return 404; }
}
