name: CI

# Pull requests are checked through `pull_request`; `push` covers only main, so a
# branch with an open pull request is not checked twice per commit.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          package-manager-cache: false

      - name: Enable the pinned pnpm release
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate

      - name: Find pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-24.12.0-pnpm-12.3.4-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build the packed generated starter
        run: pnpm acceptance:starter

      - name: Verify generated OpenAPI
        run: pnpm openapi:check

      - name: Validate OpenSpec
        run: pnpm spec:validate
